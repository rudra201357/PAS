   <p> <a href="index.php" class="home-btn">Home</a></p>
  <div class="container">
    <!-- Title section -->
    <div class="title">Admin Registration</div>
    <div class="content">
      <!-- Registration form -->
      <form id="registerForm" method="post" action="adminregister.php">

        <div class="user-details">
          <!-- Input for Full Name -->
          <div class="input-box">
            <span class="details" i>Full Name</span>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>
          </div>
          <!--  dropdown menu  -->
         <div class="input-box">
  <span class="details">Choose an Location</span>
  <select id="myDropdown" name="myDropdown" required>
    <option value="" disabled selected>Location</option>
    <option value="Kolkata">Kolkata</option>
    <option value="Midnapore">Midnapore</option>
    <option value="Chennai">Chennai</option>
     <option value="Delhi">Delhi</option>
      <option value="Mumbai">Mumbai</option>
  </select>
</div>

          <!-- Input for Email -->
          <div class="input-box">
            <span class="details">Email</span>
            <input type="text" name="email" id="email" placeholder="Enter your email" required>
          </div>
          <!-- Input for Phone Number -->
          <div class="input-box">
            <span class="details">Phone Number</span>
            <input type="tel" name="phone" id="phone" maxlength="10" pattern="[0-9]{10}" placeholder="Enter your number" required >
          </div>
          <!-- Input for Password -->
          <div class="input-box">
            <span class="details">Password</span>
            <input type="text" name="password" id="password" placeholder="Enter your password" required>
          </div>
          <!-- Input for Confirm Password -->
          <div class="input-box">
            <span class="details">Confirm Password</span>
            <input type="password" id="cpassword" name="cpassword" placeholder="Confirm your password" required>
          </div>
        </div>
        <div class="gender-details">
          <!-- Radio buttons for gender selection -->
          <input type="radio" name="gender" id="dot-1" value="Male">
          <input type="radio" name="gender" id="dot-2" value="Female">
          <span class="gender-title">Gender</span>
          <div class="category">
            <!-- Male -->
              
                <label for="dot-1">
                  <span class="dot one"></span>
                  <span class="gender">Male</span>
                </label>

            <!-- Female -->
            
            <label for="dot-2">
              <span class="dot two"></span>
              <span class="gender">Female</span>
            </label>
            <!-- Label for Prefer not to say -->
           <div class="button">
          <input type="submit" value="Register">
              
        </div>
            </label>
          </div>
        </div>
         <div id="error" style="color: red; margin-top: 10px;"></div>
      </form>
    </div>
  </div>
    <script>
      
document.getElementById("registerForm").addEventListener("submit", function(event) {
  let errorDiv = document.getElementById("error");
  errorDiv.innerText = ""; // reset first
  let email = document.getElementById("email").value;
if (!email.includes("@gmail.com")){
  event.preventDefault();
    errorDiv.innerText = "❌ Invalid email!";
    return;
}

  // ✅ Password Validation
  let pass = document.getElementById("password").value.trim();
  let cpass = document.getElementById("cpassword").value.trim();

  if (pass !== cpass) {
    event.preventDefault();
    errorDiv.innerText = "❌ Passwords do not match!";
    return;
  }
});
</script>
